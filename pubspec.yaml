name: callshield
description: Enterprise-Grade Caller ID and Spam Protection for MTC Namibia.
version: 3.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Core Infrastructure
  flutter_riverpod: 2.6.1
  dio: ^5.7.0
  sqflite: ^2.3.3
  path: ^1.9.0
  
  # Million Dollar UI
  fl_chart: ^0.70.2
  permission_handler: ^11.3.1
  flutter_animate: ^4.5.2
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
